[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cfb-coach"
version = "1.11.0"
description = "Xbox CFB 27 dynasty + Madden 27 Franchise typed play-caller (sidecar only)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
vision = ["numpy", "opencv-python", "dxcam", "mss"]
dev = ["pytest"]

[project.scripts]
cfb-coach = "cfb_coach.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cfb_coach*"]

[tool.setuptools.package-data]
cfb_coach = ["data/VALIDATION_NOTES.txt", "data/aidan_exact_macros.json", "data/macro_catalog.json", "data/meta_baseline.json", "data/seed.json", "data/madden27/*.json", "data/madden27/VALIDATION_NOTES.txt"]
