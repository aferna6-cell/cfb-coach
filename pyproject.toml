[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cfb-coach"
version = "1.2.0"
description = "Xbox CFB dynasty play-caller for Aidan's Alabama online Dynasty"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cfb-coach = "cfb_coach.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cfb_coach*"]

[tool.setuptools.package-data]
cfb_coach = ["data/seed.json", "data/meta_baseline.json"]
