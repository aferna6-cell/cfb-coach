name: Defensive V2 full Madden ML regression audit (manual)

on:
  workflow_dispatch:

jobs:
  madden-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install pillow
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Run complete Madden ML regression suite (fail if red)
        run: |
          PYTHONPATH=. python -m pytest -q tests/madden_ml
