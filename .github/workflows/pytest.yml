name: pytest

on:
  push:
    branches: [main, madden-ml/coach, madden-ml/experimental-pilot, madden-ml/offense-control-compact-ui, madden-ml/offense-model-primary-actions, madden-ml/offense-self-design, madden-ml/offense-designer-browser, madden-ml/formations-all-plays-screen-fix, madden-ml/offense-situation-variety, madden-ml/offense-situation-variety, madden-ml/full-book-inventory, madden-ml/offense-situational-actions, madden-ml/offense-situational-actions]
  pull_request:
    branches: [main, madden-ml/coach, madden-ml/experimental-pilot, cursor/execution-default-recovery-38d5, madden-ml/offense-control-compact-ui, madden-ml/offense-self-design, madden-ml/offense-designer-browser, madden-ml/formations-all-plays-screen-fix, madden-ml/offense-situation-variety, madden-ml/offense-situation-variety, madden-ml/full-book-inventory, madden-ml/offense-situational-actions, madden-ml/offense-situational-actions]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Full suite
        run: PYTHONPATH=. python -m pytest tests -p no:cacheprovider -q
      - name: Full suite (repeat)
        run: PYTHONPATH=. python -m pytest tests -p no:cacheprovider -q
