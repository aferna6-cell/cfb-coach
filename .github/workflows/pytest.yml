name: pytest

on:
  push:
    branches: [main, madden-ml/coach, madden-ml/experimental-pilot, madden-ml/offense-control-compact-ui, madden-ml/offense-model-primary-actions, madden-ml/offense-self-design, madden-ml/offense-designer-browser, madden-ml/formations-all-plays-screen-fix, madden-ml/offense-situation-variety, madden-ml/offense-situation-variety, madden-ml/full-book-inventory, madden-ml/offense-situational-actions, madden-ml/offense-situational-actions, cursor/sprint11-adaptive-coordinator-5f33, cursor/sprint12-football-intelligence-5f33, cursor/sprint13-opponent-learning-5f33, cursor/sprint14-film-learning-5f33, cursor/sprint14-1-film-review-5f33, cursor/sprint15a-elite-vod-validation-5f33]
  pull_request:
    branches: [main, madden-ml/coach, madden-ml/experimental-pilot, cursor/execution-default-recovery-38d5, madden-ml/offense-control-compact-ui, madden-ml/offense-self-design, madden-ml/offense-designer-browser, madden-ml/formations-all-plays-screen-fix, madden-ml/offense-situation-variety, madden-ml/offense-situation-variety, madden-ml/full-book-inventory, madden-ml/offense-situational-actions, madden-ml/offense-situational-actions]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg for real video fixture tests
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Full suite
        run: PYTHONPATH=. python -m pytest tests -p no:cacheprovider -q
      - name: Full suite (repeat)
        run: PYTHONPATH=. python -m pytest tests -p no:cacheprovider -q
