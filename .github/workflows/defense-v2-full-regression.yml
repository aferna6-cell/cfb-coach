name: Defensive V2 wider regression audit

on:
  push:
    branches:
      - madden-ml/defense-v2-live-test-franchise
  workflow_dispatch:

jobs:
  full-madden-ml:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install pillow
      - name: Run all Madden ML tests, report failures without suppression
        run: |
          PYTHONPATH=. python -m pytest -q tests/madden_ml
