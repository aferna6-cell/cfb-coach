name: Defensive V2 shadow pilot gates

on:
  push:
    branches:
      - madden-ml/defense-v2-test-franchise-foundation
  pull_request:
    branches:
      - madden-ml/cpu2-verification-learning-release
  workflow_dispatch:

jobs:
  verified-evidence-and-chronology:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Test defensive V2 CPU verification and time fences
        run: |
          PYTHONPATH=. python -m pytest -q tests/madden_ml/test_defense_v2_pilot.py
      - name: Compile defensive V2 model and CLI
        run: |
          python -m py_compile cfb_coach/madden/model/defense_v2_pilot.py
          python -m py_compile scripts/madden_ml/defense_v2_pilot.py
